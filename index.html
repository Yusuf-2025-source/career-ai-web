<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CareerPath</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      window.addEventListener("error", function (e) {
        var r = document.getElementById("root");
        if (r && !r.innerHTML) {
          r.innerHTML = '<div style="padding:32px;font-family:sans-serif;background:#fff1f2;color:#991b1b;border:1px solid #fecaca;margin:24px;border-radius:12px;">' +
            '<h2 style="margin:0 0 8px;">Application Error</h2>' +
            '<p style="margin:0 0 12px;">' + (e.message || "An error occurred while loading the application.") + '</p>' +
            '<small style="color:#7f1d1d;">' + (e.filename || "") + ':' + (e.lineno || "") + '</small>' +
            '</div>';
        }
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
